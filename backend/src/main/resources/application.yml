spring:
  application:
    name: backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.type.preferred_instant_jdbc_type: TIMESTAMP
  jackson:
    property-naming-strategy: SNAKE_CASE
  flyway:
    enabled: true

app:
  jwt:
    secret: ${JWT_SECRET}
    expires-days: 7
